name: Status monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: gapwise-status-publisher
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch monitor script
        run: |
          curl --fail --location --retry 4 --retry-all-errors \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/update-status.mjs" \
            --output /tmp/update-status.mjs
      - name: Probe production services and publish status
        run: node /tmp/update-status.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_ISSUE_NUMBER: "1"
