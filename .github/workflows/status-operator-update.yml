name: Update operator status

on:
  workflow_dispatch:
    inputs:
      service:
        description: Operator-maintained service to update
        required: true
        type: choice
        options:
          - auth-sync
          - auth-email
      status:
        description: Public service state
        required: true
        type: choice
        options:
          - operational
          - degraded
          - outage
          - unknown
      message:
        description: Optional public incident or recovery note
        required: false
        type: string
        default: ""

concurrency:
  group: gapwise-status-publisher
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
      - name: Publish operator-maintained service state
        run: node scripts/set-manual-status.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_ISSUE_NUMBER: "1"
          STATUS_SERVICE_ID: ${{ inputs.service }}
          STATUS_VALUE: ${{ inputs.status }}
          STATUS_MESSAGE: ${{ inputs.message }}
